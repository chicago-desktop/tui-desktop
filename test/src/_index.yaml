version: "1.0"
namespace: app

# Standalone harness for chicago/tui-desktop. Provides the host resources the
# boot needs (app:db, app:processes, gateway + api router, env storage, a
# permissive actor scope) and wires them through wippy/bootloader so the
# co-located *_test.lua suites run in isolation. The router exists only so the
# endpoint entries resolve; the command channel is covered as registry shape.
#
# The same harness brings the desktop up by hand, without the application:
#   cd test && wippy run --host chicago.tui_desktop:terminal desktop
# Harness-only; excluded from publish via the module wippy.yaml.

entries:
  - name: definition
    kind: ns.definition
    meta: { title: TUI Desktop Test Harness }

  - name: storage_test
    kind: function.lua
    meta:
      type: test
      comment: The window storage survives the "saved — read — deleted" round trip, and building a registry entry keeps foreign modules out.
      group: TUI Desktop
      suite: chicago_tui_desktop
    source: file://storage_test.lua
    modules: [sql, env, json, registry]
    imports:
      test: wippy.test:test
      repo: chicago.tui_desktop.persist:repo
      apps: chicago.tui_desktop.persist:apps
    method: run

  - name: wiring_test
    kind: function.lua
    meta:
      type: test
      comment: Hosts, processes, endpoints and policies exist and reference each other; the log on the terminal host is muted, and the command channel has no permission to spawn processes.
      group: TUI Desktop
      suite: chicago_tui_desktop
    source: file://wiring_test.lua
    modules: [registry, process, channel, time, tty]
    imports:
      test: wippy.test:test
      programs: chicago.tui_desktop.desktop:programs
      pixels: chicago.tui_desktop.desktop:pixels
      apps: chicago.tui_desktop.persist:apps
      window_api: chicago.tui_desktop.desktop:window_api
    method: run

  # A stub window in two forms: with the ctx module and without it. Two entries
  # rather than a parameter, because what is checked is the entry's declaration:
  # a window's modules are chosen not by the window's code but by whoever declared it.
  - name: window_probe
    kind: process.lua
    meta:
      comment: A stub window that declared ctx — reports the name of its compositor.
    source: file://window_probe.lua
    method: main
    modules: [process, ctx]
    imports:
      desktop: chicago.tui_desktop.desktop:window_api

  # A window that asks the compositor. The mode arrives as an argument: "naive" —
  # a loop that eats other messages from the inbox, "ask" — the library's waiting primitive.
  - name: ask_probe
    kind: process.lua
    meta:
      comment: A stub window that asks the compositor a question; checks whether the wait survives someone else's command.
    source: file://ask_probe.lua
    method: main
    modules: [process, channel, time]
    imports:
      desktop: chicago.tui_desktop.desktop:window_api

  - name: window_probe_bare
    kind: process.lua
    meta:
      comment: A stub window without ctx — an entry written before the compositor's name started being passed.
    source: file://window_probe.lua
    method: main
    modules: [process]
    imports:
      desktop: chicago.tui_desktop.desktop:window_api

  # The whole compositor, on a viewport handed out by the test. The modules are
  # the stock shell's: the mechanics are called exactly as in real use.
  - name: test_composer
    kind: process.lua
    meta:
      comment: The compositor on the test's viewport — window kinship is checked on a live one, not by registry shape.
    source: file://test_composer.lua
    method: main
    modules: [channel, env, json, logger, process, registry, sql, time, tty]
    imports:
      library: chicago.tui_desktop.desktop:library
      chrome: chicago.tui_desktop.desktop:chrome

  - name: pixel_chrome
    kind: library.lua
    meta:
      comment: A raster theme for the checks — placements without rasters, hits in cells.
    source: file://test_chrome_pixels.lua

  - name: flat_chrome
    kind: library.lua
    meta:
      comment: A raster theme that returns hits as a flat list — what a misread contract looks like.
    source: file://test_chrome_flat.lua
    imports:
      pixel_chrome: app:pixel_chrome

  # The compositor in pixel mode. It has no gfx module on purpose: the cell
  # size is brought by the shell, and the check takes the same path as the real one.
  - name: test_composer_pixels
    kind: process.lua
    meta:
      comment: The compositor with pixel chrome on the test's viewport.
    source: file://test_composer_pixels.lua
    method: main
    modules: [channel, env, json, logger, process, registry, security, sql, time, tty]
    imports:
      library: chicago.tui_desktop.desktop:library
      pixel_chrome: app:pixel_chrome
      flat_chrome: app:flat_chrome
      cell_chrome: chicago.tui_desktop.desktop:chrome
      widget_cells: app:widget_cells_chrome

  - name: widget_cells_chrome
    kind: library.lua
    meta:
      comment: The stock cell theme plus the widget marks and hit records of the pixel test theme — widgets must reach fill in cells mode too.
    source: file://test_chrome_cells.lua
    imports:
      stock: chicago.tui_desktop.desktop:chrome
      pixel_chrome: app:pixel_chrome

  # Desktop widgets (FR-006): the compositor spawns these the way it spawns the
  # state provider of a view window. One source, three entries, because a
  # running widget is keyed by its entry.
  - name: widget_alpha
    kind: process.lua
    meta:
      comment: A widget process for the tests — publishes a state naming its id and size, and again on request.
    source: file://widget_probe.lua
    method: main
    modules: [channel, process, time]

  - name: widget_beta
    kind: process.lua
    meta:
      comment: A second widget process for the tests, the same source under another entry.
    source: file://widget_probe.lua
    method: main
    modules: [channel, process, time]

  - name: widget_gamma
    kind: process.lua
    meta:
      comment: A third widget process for the tests — the entry that appears only on desktop.refresh.
    source: file://widget_probe.lua
    method: main
    modules: [channel, process, time]

  - name: painter_window
    kind: process.lua
    meta:
      type: tui_desktop.window
      title: Painting window
      in_menu: false
      comment: A window that puts one recognisable line into its viewport.
    source: file://painter_window.lua
    method: main
    modules: [channel, time, tty]

  - name: probe_render
    kind: library.lua
    meta:
      comment: The window's view — a pure rendering library; the reference to it must lead to a live entry.
    source: file://probe_render.lua

  - name: state_probe
    kind: process.lua
    meta:
      comment: The state provider of a view window — pushes the state itself and takes input.
    source: file://state_probe.lua
    method: main
    modules: [channel, process, time]

  # A view window: there is no process inside, the theme draws it, the provider brings the data.
  - name: view_window
    kind: process.lua
    meta:
      type: tui_desktop.window
      title: View window
      in_menu: false
      window_content: pixels
      render: app:probe_render
      state: app:state_probe
      comment: A window whose content the theme draws while a separate process brings the data.
    source: file://idle_window.lua
    method: main
    modules: [channel, time]

  # Two broken entries: both must refuse with a reason rather than open as
  # a window there is nothing to draw with.
  - name: view_static
    kind: process.lua
    meta:
      type: tui_desktop.window
      title: View without provider
      in_menu: false
      window_content: pixels
      render: app:probe_render
    source: file://idle_window.lua
    method: main
    modules: [channel, time]

  - name: view_without_render
    kind: process.lua
    meta:
      type: tui_desktop.window
      title: View without render
      in_menu: false
      window_content: pixels
    source: file://idle_window.lua
    method: main
    modules: [channel, time]

  - name: view_with_dead_render
    kind: process.lua
    meta:
      type: tui_desktop.window
      title: View with dead reference
      in_menu: false
      window_content: pixels
      render: app:nowhere
    source: file://idle_window.lua
    method: main
    modules: [channel, time]

  # The only harness entry that is VISIBLE in the menu: that way the item the
  # check clicks is known in advance and does not depend on the sort order.
  - name: menu_target
    kind: process.lua
    meta:
      type: tui_desktop.window
      title: Menu target
      comment: A window opened from the menu — and only from the menu.
    source: file://idle_window.lua
    method: main
    modules: [channel, time]

  # The menu is sorted by title, and the suites expect this entry above
  # menu_target: its title must sort before "Menu target".
  - name: menu_second
    kind: process.lua
    meta:
      type: tui_desktop.window
      title: Another target
      comment: The second menu item — without it the arrow in the menu has nowhere to move.
    source: file://idle_window.lua
    method: main
    modules: [channel, time]

  - name: dialog_probe
    kind: process.lua
    meta:
      type: tui_desktop.window
      title: Window with a dialog
      in_menu: false
      comment: A window that opens its own dialog and an ordinary program beside it.
    source: file://dialog_probe.lua
    method: main
    modules: [channel, process, time]
    imports:
      desktop: chicago.tui_desktop.desktop:window_api

  - name: refusal_probe
    kind: process.lua
    meta:
      type: tui_desktop.window
      title: Window with a miss
      in_menu: false
      comment: A window that sends a command that misses and listens on the reply channel.
    source: file://refusal_probe.lua
    method: main
    modules: [channel, process, time]
    imports:
      desktop: chicago.tui_desktop.desktop:window_api

  - name: idle_window
    kind: process.lua
    meta:
      type: tui_desktop.window
      title: Plain window
      in_menu: false
      comment: A window without a frame or input — exists until it is closed.
    source: file://idle_window.lua
    method: main
    modules: [channel, time]

  - name: db
    kind: db.sql.sqlite
    meta:
      comment: In-memory database — the harness does not use it, but the loader asks for the resource.
    file: ":memory:"

  - name: env_storage
    kind: env.storage.file
    meta:
      type: envstorage
    file_path: ./.wippy/test.env
    auto_create: true

  - name: processes
    kind: process.host
    lifecycle:
      auto_start: true

  # The endpoint and static entries resolve against these resources at boot;
  # no suite calls them over HTTP — the wiring suite checks registry shape.
  - name: gateway
    kind: http.service
    addr: :19219
    lifecycle:
      auto_start: true

  - name: api
    kind: http.router
    meta:
      server: gateway
    prefix: /api

  - name: user
    kind: security.policy
    meta:
      comment: Permissive actor scope for the suites.
    policy:
      resources: '*'
      actions: '*'
      effect: allow

  # The harness source is the lock root. Its .wippy.yaml replaces the declared
  # chicago/tui-desktop dependency with ../ so the module's canonical source and
  # colocated tests load directly without a lock-file replacement.

  # The harness tests the module, so it depends on it. The replacement in .wippy.yaml
  # substitutes the working copy from ../ here, so the source and the colocated
  # tests load directly, without publishing.
  - name: tui_desktop_harness.dep.module
    version: "*"
    kind: ns.dependency
    meta:
      comment: The module under test; its source is replaced with ../ in .wippy.yaml.
    component: "chicago/tui-desktop"
    parameters:
      - name: chicago.tui_desktop:api_router
        value: app:api

  - name: tui_desktop_harness.dep.migration
    version: "*"
    kind: ns.dependency
    meta:
      comment: Host binding for the migration dependency used by the module under test.
    component: "wippy/migration"
    parameters:
      - name: wippy.migration:app_db
        value: app:db

  - name: tui_desktop_harness.dep.security
    version: "*"
    kind: ns.dependency
    meta:
      comment: Platform security groups (wippy.security:process) that give host-managed services their policy scope under strict mode.
    component: "wippy/security"

  - name: tui_desktop_harness.dep.bootloader
    version: "*"
    kind: ns.dependency
    meta:
      comment: Host wiring for the standalone test harness.
    component: "wippy/bootloader"
    parameters:
      - name: wippy.bootloader:application_host
        value: app:processes
      - name: wippy.bootloader:env_storage
        value: app:env_storage

  # Focus probe window: draws a frame and forwards every focus event to the
  # test under its own name (the open argument).
  - name: focus_probe
    kind: process.lua
    meta:
      type: tui_desktop.window
      title: Focus probe
      in_menu: false
      comment: A window that reports every focus event it receives, in order, to the test.
    source: file://focus_probe.lua
    method: main
    modules: [channel, process, time, tty]

  - name: window_focus_test
    kind: function.lua
    meta:
      type: test
      comment: The compositor tells the window that lost the keyboard and the one that got it, on open and on minimize, in order and without repeats.
      group: TUI Desktop
      suite: chicago_tui_desktop
    source: file://window_focus_test.lua
    modules: [channel, process, time, tty, registry]
    imports:
      test: wippy.test:test
    method: run

  - name: widgets_test
    kind: function.lua
    meta:
      type: test
      comment: Desktop widgets on a live compositor — spawned from the shell's list in order, a bad size refused by entry, state only from their own process, stopped and respawned on refresh, drawn in both modes, clicked like a tray item.
      group: TUI Desktop
      suite: chicago_tui_desktop
    source: file://widgets_test.lua
    modules: [channel, process, time, tty]
    imports:
      test: wippy.test:test
    method: run

  # A view window with no state provider: the theme draws it, nothing is
  # spawned for it, and no shared name gets registered.
  - name: args_view
    kind: process.lua
    meta:
      type: tui_desktop.window
      title: Args view
      in_menu: false
      window_content: pixels
      render: app:probe_render
      comment: A view window without a state provider, for window_args_test — its record keeps the args it was opened with.
    source: file://idle_window.lua
    method: main
    modules: [channel, time]

  - name: window_args_test
    kind: function.lua
    meta:
      type: test
      comment: The window description reports the args a window was opened with — a process window and a view window, in desktop.open and desktop.list — so an opener can focus the window already open for the same thing.
      group: TUI Desktop
      suite: chicago_tui_desktop
    source: file://window_args_test.lua
    modules: [channel, process, time, tty]
    imports:
      test: wippy.test:test
    method: run

  # Motion probe window: reports every mouse and focus event to the watcher
  # named in its argument ("<watcher>|<label>") — never a fixed shared name.
  - name: motion_probe
    kind: process.lua
    meta:
      type: tui_desktop.window
      title: Motion probe
      in_menu: false
      comment: A window that reports every mouse and focus event it receives to the test's own watcher.
    source: file://motion_probe.lua
    method: main
    modules: [channel, process, time, tty]

  - name: window_resize_test
    kind: function.lua
    meta:
      type: test
      comment: The size handle is the last two cells of the bottom frame row and keeps the pointer's offset; the third cell does nothing, and a window with resizable false ignores the handle.
      group: TUI Desktop
      suite: chicago_tui_desktop
    source: file://window_resize_test.lua
    modules: [channel, process, time, tty]
    imports:
      test: wippy.test:test
    method: run

  - name: window_outline_test
    kind: function.lua
    meta:
      type: test
      comment: A move or resize drag shows an outline and the window takes its rect on the release; Esc drops the outline; a burst of motions is a few frames, named batch, not one per motion.
      group: TUI Desktop
      suite: chicago_tui_desktop
    source: file://window_outline_test.lua
    modules: [channel, process, time, tty]
    imports:
      test: wippy.test:test
    method: run

  - name: pixels_overlay_test
    kind: function.lua
    meta:
      type: test
      comment: pixels.frame blanks the cells under a picture but not under an overlay — a drag's outline is transparent but for its line, and the text under it stays.
      group: TUI Desktop
      suite: chicago_tui_desktop
    source: file://pixels_overlay_test.lua
    modules: [tty]
    imports:
      test: wippy.test:test
      pixels: chicago.tui_desktop.desktop:pixels
    method: run

  - name: desktop_slots_test
    kind: function.lua
    meta:
      type: test
      comment: Several desktops of one name claim name, name.2, …; a freed name is taken again; window_api.desktops finds every one running.
      group: TUI Desktop
      suite: chicago_tui_desktop
    source: file://desktop_slots_test.lua
    modules: [channel, process, time, tty]
    imports:
      test: wippy.test:test
      desktop: chicago.tui_desktop.desktop:window_api
    method: run

  # What a logged-on person needs to open a shell (window_pty's meta.requires).
  - name: pty_allowed
    kind: security.policy
    meta:
      comment: Lets a test identity open a PTY window.
    policy:
      actions: [tui_desktop.pty]
      resources: "*"
      effect: allow

  - name: desktop_requires_test
    kind: function.lua
    meta:
      type: test
      comment: A window whose entry names meta.requires opens only for a logged-on identity whose scope allows that action; a shell is refused to a person without it, with the reason.
      group: TUI Desktop
      suite: chicago_tui_desktop
    source: file://desktop_requires_test.lua
    modules: [channel, process, time, tty]
    imports:
      test: wippy.test:test
    method: run

  - name: desktop_cancel_test
    kind: function.lua
    meta:
      type: test
      comment: A cancel shuts the desktop down with its windows closed, not left orphaned.
      group: TUI Desktop
      suite: chicago_tui_desktop
    source: file://desktop_cancel_test.lua
    modules: [channel, process, time, tty]
    imports:
      test: wippy.test:test
    method: run

  # A window whose entry fixes its size, for the size handle test.
  - name: fixed_window
    kind: process.lua
    meta:
      type: tui_desktop.window
      title: Fixed window
      in_menu: false
      width: 24
      height: 8
      resizable: false
      comment: A window without a frame or input whose entry declares resizable false.
    source: file://idle_window.lua
    method: main
    modules: [channel, time]

  # A window that flashes itself through window_api.flash, naming no window.
  - name: flash_probe
    kind: process.lua
    meta:
      type: tui_desktop.window
      title: Flash probe
      in_menu: false
      comment: A window that asks the compositor to flash it without naming a window — the sender's own.
    source: file://flash_probe.lua
    method: main
    modules: [channel, time]
    imports:
      desktop: chicago.tui_desktop.desktop:window_api

  - name: notify_test
    kind: function.lua
    meta:
      type: test
      comment: Notifications on a live compositor — balloons show one at a time, queue, replace by key, time out, refuse the ninth and answer clicks on the × and the body; a flash swaps its looks until focus, count or stop; the notice line keeps its ttl, clears on empty text and yields to a later notice.
      group: TUI Desktop
      suite: chicago_tui_desktop
    source: file://notify_test.lua
    modules: [channel, process, time, tty]
    imports:
      test: wippy.test:test
      desktop: chicago.tui_desktop.desktop:window_api
    method: run

  - name: window_motion_test
    kind: function.lua
    meta:
      type: test
      comment: Plain mouse motion reaches only the focused window's client, in client cells, once per cell — nothing over the frame, the desktop or another window; leaving the client forgets the cell.
      group: TUI Desktop
      suite: chicago_tui_desktop
    source: file://window_motion_test.lua
    modules: [channel, process, time, tty]
    imports:
      test: wippy.test:test
    method: run

  # A view window whose provider publishes the title and picture the test asks
  # for; the provider reports to the watcher named in the window's argument —
  # never a fixed shared name.
  - name: image_provider
    kind: process.lua
    meta:
      comment: A view window's state provider that publishes the title and image the test asks for, through window_api.publish_state.
    source: file://image_provider.lua
    method: main
    modules: [channel, process, time]
    imports:
      desktop: chicago.tui_desktop.desktop:window_api

  - name: image_view
    kind: process.lua
    meta:
      type: tui_desktop.window
      title: Image view
      image: drive
      in_menu: false
      window_content: pixels
      render: app:probe_render
      state: app:image_provider
      comment: A view window for window_image_test — its provider changes the title and the title-bar picture.
    source: file://idle_window.lua
    method: main
    modules: [channel, time]

  - name: window_image_test
    kind: function.lua
    meta:
      type: test
      comment: A view window's published state carries image beside title — the title-bar picture changes, desktop.list reports it, and an absent or empty image keeps the one the window has.
      group: TUI Desktop
      suite: chicago_tui_desktop
    source: file://window_image_test.lua
    modules: [channel, process, time, tty]
    imports:
      test: wippy.test:test
    method: run

  # A window that ignores `close` — the stand-in for an application that
  # refuses a close request.
  - name: stubborn_window
    kind: process.lua
    meta:
      type: tui_desktop.window
      title: Stubborn
      in_menu: false
      comment: A window that starts its terminal and ignores every close — only a kill ends it.
    source: file://stubborn_window.lua
    method: main
    modules: [channel, time, tty]

  - name: window_close_test
    kind: function.lua
    meta:
      type: test
      comment: A close is a request a window may refuse — it stays with a notice after the grace; a window that closes itself goes; a PTY window closes as before; force and shutdown kill after the grace.
      group: TUI Desktop
      suite: chicago_tui_desktop
    source: file://window_close_test.lua
    modules: [channel, process, time, tty]
    imports:
      test: wippy.test:test
    method: run

  # A window that answers every close by refusing it through window_api, and
  # reports the closes it got to the watcher named in its argument.
  - name: refusing_window
    kind: process.lua
    meta:
      type: tui_desktop.window
      title: Refuser
      in_menu: false
      comment: A window that answers every close with desktop.close{refused = true} from its own process and stays.
    source: file://refusing_window.lua
    method: main
    modules: [channel, process, time, tty, ctx]
    imports:
      desktop: chicago.tui_desktop.desktop:window_api

  - name: window_refuse_test
    kind: function.lua
    meta:
      type: test
      comment: A close refused by the window's own process ends the request without a notice and the next close asks again; a refusal from any other process is refused and changes nothing.
      group: TUI Desktop
      suite: chicago_tui_desktop
    source: file://window_refuse_test.lua
    modules: [channel, process, time, tty]
    imports:
      test: wippy.test:test
    method: run

  - name: presentation_window
    kind: process.lua
    source: file://painter_window.lua
    method: main
    modules: [channel, time, tty]
    meta: {type: tui_desktop.window, title: Preview, in_menu: false, presentation: true}
  - name: presentation_test
    kind: function.lua
    source: file://presentation_test.lua
    method: run
    modules: [channel, process, time, tty]
    meta: {type: test, suite: chicago_tui_desktop, group: Presentation}
    imports:
      test: wippy.test:test

  - name: interactive_presentation_window
    kind: process.lua
    source: file://interactive_presentation_window.lua
    method: main
    modules: [channel, tty]
    meta: {type: tui_desktop.window, title: Game, in_menu: false, presentation: true, presentation_interactive: true}
