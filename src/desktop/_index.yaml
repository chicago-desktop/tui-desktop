version: "1.0"
namespace: chicago.tui_desktop.desktop

entries:
  - name: input
    kind: library.lua
    meta: {comment: "Canonical window keyboard and pointer events."}
    source: file://input.lua

  - name: geometry
    kind: library.lua
    meta: {comment: "Window client rectangles in cells."}
    source: file://geometry.lua

  - name: text
    kind: library.lua
    meta: {comment: "UTF-8 runes, cell counts and clipping — one splitter for every window."}
    source: file://text.lua

  - name: scroll
    kind: library.lua
    meta: {comment: "Bounded scrolling and shared scrollbar geometry."}
    source: file://scroll.lua
    imports:
      geometry: chicago.tui_desktop.desktop:geometry

  # chicago.tui_desktop.desktop:chrome
  - name: chrome
    kind: library.lua
    meta:
      comment: The standard theme — borders, titles, buttons, the window bar and the status line. Pure strings without a single call into the runtime.
    source: file://chrome.lua
    modules:
      - tty

  # chicago.tui_desktop.desktop:programs
  - name: programs
    kind: library.lua
    meta:
      comment: What a registry entry says about its program — the window type and the "show in the menu" flag. Pure tables, not a single call into the runtime.
    source: file://programs.lua

  # chicago.tui_desktop.desktop:pixels
  - name: pixels
    kind: library.lua
    meta:
      comment: Assembling the pixel frame — spaces under pictures, parsing placements and hits. Pure arithmetic, not a single call into the runtime.
    source: file://pixels.lua

  # chicago.tui_desktop.desktop:window_api
  - name: window_api
    kind: library.lua
    meta:
      comment: What a window can ask of the desktop — open, close, raise a neighbouring window. The compositor's name is taken from the process context, not from a constant.
    source: file://window_api.lua
    imports:
      input: chicago.tui_desktop.desktop:input
    modules:
      - process
      # A window reads the name of its compositor from here. The module is declared HERE, not
      # in the window's entry: a library gets its own modules, so windows written
      # before this field work without a single edit.
      - ctx
      # Otherwise the "desktop not found" refusal would not report itself at all: `open`
      # does not wait for a reply, and a window that did not check the return value stays silent.
      - logger
      # The reply arrives on its own channel, and waiting for it is limited by a deadline.
      - channel
      - time

  # chicago.tui_desktop.desktop:library
  #
  # The compositor's mechanics without the look. A second shell calls it with its own theme:
  # that way the look changes without copying window hosting, the PTY and the command channel.
  - name: library
    kind: library.lua
    meta:
      comment: The compositor as a callable library — run(options) with the theme in options.chrome. The theme contract is described in the README.
    source: file://library.lua
    modules:
      - channel
      - env
      - json
      - logger
      - process
      - registry
      - sql
      - time
      - tty
    imports:
      repo: chicago.tui_desktop.persist:repo
      apps: chicago.tui_desktop.persist:apps
      programs: chicago.tui_desktop.desktop:programs
      pixels: chicago.tui_desktop.desktop:pixels
      # For the sake of one key: the compositor's name is put into a window's context under the
      # same name the window reads it by.
      window_api: chicago.tui_desktop.desktop:window_api

  # chicago.tui_desktop.desktop:desktop
  - name: desktop
    kind: process.lua
    meta:
      comment: The compositor — the only process on the real terminal. Holds the windows, dispatches input, accepts commands from outside.
      command:
        name: desktop
        short: Windowing desktop in the terminal
        security:
          actor: {id: chicago.tui_desktop.desktop:desktop}
          policies:
            - chicago.tui_desktop.security:desktop_runtime
            # The window storage reads the database name from the environment (persist:repo), and without
            # this permission it silently takes the default.
            - chicago.tui_desktop.security:storage_env
    source: file://desktop.lua
    method: main
    modules:
      - channel
      - env
      - json
      - logger
      - process
      - registry
      - sql
      - time
      - tty
    imports:
      library: chicago.tui_desktop.desktop:library
      chrome: chicago.tui_desktop.desktop:chrome

  # chicago.tui_desktop.desktop:window_pty
  - name: window_pty
    kind: process.lua
    meta:
      type: tui_desktop.window
      title: Bash
      group: Programs
      # There is no icon here on purpose: the base has its own only for the "program" kind, and
      # it is the default for the kind anyway. An icon named here would take
      # PRIORITY over the shell's declaration (`chicago.program_images`), that is,
      # the shell could not give the window its own — and icon names are its package.
      width: 80
      height: 24
      comment: A window with a real program under a PTY. It sees an ordinary tty port and does not know it is a window.
      # The program runs under this entry's policy (exec allowed), not the
      # logged-on person's: it is a shell on the server. So the compositor
      # opens it only for an identity whose scope allows this action.
      requires: tui_desktop.pty
    source: file://window_pty.lua
    method: main
    modules:
      - channel
      - exec
      - tty
    security:
      policies: [chicago.tui_desktop.security:desktop_runtime]
