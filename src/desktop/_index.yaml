version: "1.0"
namespace: butschster.tui_desktop.desktop

entries:
  - name: input
    kind: library.lua
    meta: {comment: "Canonical window keyboard and pointer events."}
    source: file://input.lua

  - name: geometry
    kind: library.lua
    meta: {comment: "Window client rectangles in cells."}
    source: file://geometry.lua

  - name: text
    kind: library.lua
    meta: {comment: "UTF-8 runes, cell counts and clipping — one splitter for every window."}
    source: file://text.lua

  - name: scroll
    kind: library.lua
    meta: {comment: "Bounded scrolling and shared scrollbar geometry."}
    source: file://scroll.lua
    imports:
      geometry: butschster.tui_desktop.desktop:geometry

  # butschster.tui_desktop.desktop:chrome
  - name: chrome
    kind: library.lua
    meta:
      comment: Штатная тема — рамки, заголовки, кнопки, полоса окон и статусная строка. Чистые строки без единого вызова в рантайм.
    source: file://chrome.lua
    modules:
      - tty

  # butschster.tui_desktop.desktop:programs
  - name: programs
    kind: library.lua
    meta:
      comment: Что запись реестра говорит о своей программе — тип окна и признак «показывать в меню». Чистые таблицы, ни одного вызова в рантайм.
    source: file://programs.lua

  # butschster.tui_desktop.desktop:pixels
  - name: pixels
    kind: library.lua
    meta:
      comment: Сборка пиксельного кадра — пробелы под картинками, разбор размещений и попаданий. Чистая арифметика, ни одного вызова в рантайм.
    source: file://pixels.lua

  # butschster.tui_desktop.desktop:window_api
  - name: window_api
    kind: library.lua
    meta:
      comment: Что окно может попросить у десктопа — открыть, закрыть, поднять соседнее окно. Имя композитора берётся из контекста процесса, а не из константы.
    source: file://window_api.lua
    imports:
      input: butschster.tui_desktop.desktop:input
    modules:
      - process
      # Имя своего композитора окно читает отсюда. Модуль объявлен ЗДЕСЬ, а не
      # у записи окна: библиотека получает свои модули, поэтому окна, написанные
      # до этого поля, работают без единой правки.
      - ctx
      # Отказ «десктоп не найден» иначе не расскажет о себе никак: `open`
      # ответа не ждёт, и окно, не проверившее возврат, промолчит.
      - logger
      # Ответ приходит своим каналом, и ожидание его ограничено сроком.
      - channel
      - time

  # butschster.tui_desktop.desktop:library
  #
  # Механика композитора без вида. Вторая оболочка зовёт её со своей темой:
  # так вид меняется, не копируя хостинг окон, PTY и командный канал.
  - name: library
    kind: library.lua
    meta:
      comment: Композитор как вызываемая библиотека — run(options) с темой в options.chrome. Контракт темы описан в README.
    source: file://library.lua
    modules:
      - channel
      - env
      - json
      - logger
      - process
      - registry
      - sql
      - time
      - tty
    imports:
      repo: butschster.tui_desktop.persist:repo
      apps: butschster.tui_desktop.persist:apps
      programs: butschster.tui_desktop.desktop:programs
      pixels: butschster.tui_desktop.desktop:pixels
      # Ради одного ключа: имя композитора кладётся окну в контекст под тем
      # же именем, под которым окно его читает.
      window_api: butschster.tui_desktop.desktop:window_api

  # butschster.tui_desktop.desktop:desktop
  - name: desktop
    kind: process.lua
    meta:
      comment: Композитор — единственный процесс на настоящем терминале. Держит окна, раздаёт ввод, принимает команды снаружи.
      command:
        name: desktop
        short: Оконный десктоп в терминале
        security:
          actor: {id: butschster.tui_desktop.desktop:desktop}
          policies:
            - butschster.tui_desktop.security:desktop_runtime
            # Хранилище окон читает имя базы из окружения (persist:repo), и без
            # этого права оно молча берёт умолчание.
            - butschster.tui_desktop.security:storage_env
    source: file://desktop.lua
    method: main
    modules:
      - channel
      - env
      - json
      - logger
      - process
      - registry
      - sql
      - time
      - tty
    imports:
      library: butschster.tui_desktop.desktop:library
      chrome: butschster.tui_desktop.desktop:chrome

  # butschster.tui_desktop.desktop:window_pty
  - name: window_pty
    kind: process.lua
    meta:
      type: tui_desktop.window
      title: Bash
      group: Programs
      # Значка здесь нет нарочно: свой у основы только вид «программа», и
      # он и так умолчание по виду. Названный здесь значок был бы
      # ПРИОРИТЕТНЕЕ объявления оболочки (`windows.program_images`), то есть
      # оболочка не могла бы дать окну свой — а имена значков это её пакет.
      width: 80
      height: 24
      comment: Окно с настоящей программой под PTY. Видит обычный tty-порт и не знает, что оно окно.
      # The program runs under this entry's policy (exec allowed), not the
      # logged-on person's: it is a shell on the server. So the compositor
      # opens it only for an identity whose scope allows this action.
      requires: tui_desktop.pty
    source: file://window_pty.lua
    method: main
    modules:
      - channel
      - exec
      - tty
    security:
      policies: [butschster.tui_desktop.security:desktop_runtime]
