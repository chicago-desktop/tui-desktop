version: "1.0"
namespace: windows.tui_desktop.persist

# Хранилище окон, собранных в рантайме.
#
# Возвращает их в реестр композитор, а не фоновый сервис: платформа намеренно
# запрещает процессам в группе `wippy.security:process` менять реестр —
# политика `wippy.security:registry.no_write` перекрывает разрешения явным
# `deny`. Обходить этот запрет ради восстановления окон не стоит, а композитор
# работает под собственным актором, и права у него свои.

entries:
  # windows.tui_desktop.persist:repo
  - name: repo
    kind: library.lua
    meta:
      comment: Одна строка на окно; имя — ключ, повторная сборка перезаписывает.
    source: file://repo.lua
    modules:
      - sql
      - env
      - json

  # windows.tui_desktop.persist:apps
  - name: apps
    kind: library.lua
    meta:
      comment: Сборка записи реестра из сохранённого окна — общая для мастерской и загрузчика.
    source: file://apps.lua
    modules:
      - registry
