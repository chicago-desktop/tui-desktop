version: "1.0"
namespace: windows.tui_desktop.persist

# Storage of windows built in the runtime.
#
# They are returned to the registry by the compositor, not by a background
# service: the platform deliberately forbids processes in the group
# `wippy.security:process` to change the registry — the policy
# `wippy.security:registry.no_write` overrides permissions with an explicit
# `deny`. Working around this ban to restore windows is not worth it, and the
# compositor runs under its own actor and has its own permissions.

entries:
  # windows.tui_desktop.persist:repo
  - name: repo
    kind: library.lua
    meta:
      comment: One row per window; the name is the key, a repeated build overwrites.
    source: file://repo.lua
    modules:
      - sql
      - env
      - json

  # windows.tui_desktop.persist:apps
  - name: apps
    kind: library.lua
    meta:
      comment: Building a registry entry from a saved window — shared by the workshop and the loader.
    source: file://apps.lua
    modules:
      - registry
