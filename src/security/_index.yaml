version: "1.0"
namespace: chicago.tui_desktop.security

# The permissions are split into three, not merged into one "anything goes":
# the compositor needs to spawn processes and launch programs, the command
# channel only to find the compositor and talk to it, and access to the
# endpoints is granted by the application.

entries:
  # chicago.tui_desktop.security:desktop_runtime
  - name: desktop_runtime
    kind: security.policy
    meta:
      comment: Permissions of the compositor and the windows — spawn processes with a grant on the viewport, terminate them and launch programs under a PTY.
    policy:
      actions:
        - process.context
        - process.spawn
        - process.spawn.monitored
        - process.monitor
        - process.host
        - process.terminate
        - process.send
        - process.registry
        - process.registry.register
        - process.registry.unregister
        # Windows are spawned under the identity of the logged-on user (options.logon
        # of library.run): substituting a child's actor and scope is a separate permission;
        # without it `with_actor` refuses with "custom security context".
        - process.security
        - exec.get
        - exec.run
        # The application's window catalog is read from the registry by meta.type, and windows
        # built in the runtime are brought back into it at desktop start.
        - registry.get
        - registry.find
        - registry.entry
        - registry.apply
        # The window storage is read at desktop start; it is checked as
        # `db.get` on the database's resource id.
        - db.get
      resources: "*"
      effect: allow

  # chicago.tui_desktop.security:storage_env
  #
  # One variable, not "*": the application may reassign the name of the
  # database where the windows are kept. The permission is narrow on purpose —
  # the same `env.get` reads tokens under neighbouring names — and `env.get`
  # without the permission does not refuse loudly: it returns nil, and
  # `or "app:db"` next to it turns a permission refusal into "the person
  # reassigned nothing".
  - name: storage_env
    kind: security.policy
    meta:
      comment: Permission to read the window database's name from the environment. One variable, not the whole environment.
    policy:
      actions:
        - env.get
      resources:
        - TUI_DESKTOP_DB_ID
      effect: allow

  # chicago.tui_desktop.security:desktop_command_channel
  - name: desktop_command_channel
    kind: security.policy
    meta:
      comment: Permissions of the command channel endpoints — find the compositor by name and send it a command. Spawning processes and launching programs are deliberately absent here.
    policy:
      actions:
        - process.context
        - process.registry
        - process.send
      resources: "*"
      effect: allow

  # chicago.tui_desktop.security:desktop_endpoint_access
  - name: desktop_endpoint_access
    kind: security.policy
    meta:
      comment: Authenticated users of the application may call the desktop endpoints.
    groups: []
    policy:
      resources:
        - chicago.tui_desktop.api:*
      actions: access
      effect: allow

  # chicago.tui_desktop.security:user_security_scope
  - name: user_security_scope
    kind: ns.requirement
    meta:
      comment: The application's security group that is given access to the desktop endpoints.
    targets:
      - entry: chicago.tui_desktop.security:desktop_endpoint_access
        path: ".groups +="

  # chicago.tui_desktop.security:workshop_scope
  #
  # The workshop and the loader: read the registry, apply a version to it,
  # read and write a storage row. Permissions to spawn processes and
  # launch programs are not included — windows are opened by the compositor,
  # which has them.
  - name: workshop_scope
    kind: security.policy
    meta:
      comment: Permissions of the workshop and the loader of windows built in the runtime.
    policy:
      actions:
        - process.context
        - registry.get
        - registry.entry
        - registry.apply
        - db.get
      resources: "*"
      effect: allow

  # chicago.tui_desktop.security:app_window_scope
  #
  # A window built in the runtime. It draws itself and reads data, but does not
  # spawn processes, launch programs or change the registry: the window's code
  # arrives over HTTP, and the permissions are granted exactly for drawing and reading.
  #
  # `db.get` is here because `sql` is in the window's module whitelist: without
  # this permission a data widget would be applied, get into the menu and crash
  # on the first open — that is, the refusal would come as late as possible, when
  # it is hardest to tie to the cause.
  - name: app_window_scope
    kind: security.policy
    meta:
      comment: Permissions of a window built in the runtime.
    policy:
      actions:
        - process.context
        - db.get
        # A window asks the compositor to open a neighbouring window — by the same path as
        # the command channel from outside. It still cannot spawn processes or launch
        # programs: those permissions are not here.
        - process.send
        - process.registry
      resources: "*"
      effect: allow
