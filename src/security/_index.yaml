version: "1.0"
namespace: windows.tui_desktop.security

# Права разделены на три, а не слиты в одну «всё можно»: композитору нужно
# порождать процессы и запускать программы, командному каналу — только
# найти композитор и заговорить с ним, а доступ к ручкам выдаёт приложение.

entries:
  # windows.tui_desktop.security:desktop_runtime
  - name: desktop_runtime
    kind: security.policy
    meta:
      comment: Права композитора и окон — порождать процессы с грантом на viewport, гасить их и запускать программы под PTY.
    policy:
      actions:
        - process.context
        - process.spawn
        - process.spawn.monitored
        - process.monitor
        - process.host
        - process.terminate
        - process.send
        - process.registry
        - process.registry.register
        - process.registry.unregister
        # Окна порождаются под личностью вошедшего пользователя (options.logon
        # у library.run): подменить актора и скоуп потомка — отдельное право,
        # без него `with_actor` отказывает «custom security context».
        - process.security
        - exec.get
        - exec.run
        # Каталог окон приложения читается из реестра по meta.type, а окна,
        # собранные в рантайме, возвращаются в него на старте десктопа.
        - registry.get
        - registry.find
        - registry.entry
        - registry.apply
        # Хранилище окон читается на старте десктопа; проверяется как
        # `db.get` на идентификатор ресурса базы.
        - db.get
      resources: "*"
      effect: allow

  # windows.tui_desktop.security:storage_env
  #
  # Одна переменная, а не «*»: имя базы, где лежат окна, приложение может
  # переназначить. Право узкое нарочно — под этим же именем ходят токены, а
  # `env.get` без права не отказывает громко: он возвращает nil, и `or "app:db"`
  # рядом превращает отказ по правам в «человек ничего не переназначал».
  - name: storage_env
    kind: security.policy
    meta:
      comment: Право прочитать имя базы окон из окружения. Одна переменная, а не всё окружение.
    policy:
      actions:
        - env.get
      resources:
        - TUI_DESKTOP_DB_ID
      effect: allow

  # windows.tui_desktop.security:desktop_command_channel
  - name: desktop_command_channel
    kind: security.policy
    meta:
      comment: Права ручек командного канала — найти композитор по имени и послать ему команду. Ни порождения процессов, ни запуска программ здесь нет намеренно.
    policy:
      actions:
        - process.context
        - process.registry
        - process.send
      resources: "*"
      effect: allow

  # windows.tui_desktop.security:desktop_endpoint_access
  - name: desktop_endpoint_access
    kind: security.policy
    meta:
      comment: Аутентифицированные пользователи приложения могут обращаться к ручкам десктопа.
    groups: []
    policy:
      resources:
        - windows.tui_desktop.api:*
      actions: access
      effect: allow

  # windows.tui_desktop.security:user_security_scope
  - name: user_security_scope
    kind: ns.requirement
    meta:
      comment: Группа безопасности приложения, которой открыт доступ к ручкам десктопа.
    targets:
      - entry: windows.tui_desktop.security:desktop_endpoint_access
        path: ".groups +="

  # windows.tui_desktop.security:workshop_scope
  #
  # Мастерская и загрузчик: прочитать реестр, применить к нему версию,
  # прочитать и записать строку хранилища. Права порождать процессы и
  # запускать программы сюда не входят — окна открывает композитор, у
  # которого они есть.
  - name: workshop_scope
    kind: security.policy
    meta:
      comment: Права мастерской и загрузчика окон, собранных в рантайме.
    policy:
      actions:
        - process.context
        - registry.get
        - registry.entry
        - registry.apply
        - db.get
      resources: "*"
      effect: allow

  # windows.tui_desktop.security:app_window_scope
  #
  # Окно, собранное в рантайме. Оно рисует себя и читает данные, но не
  # порождает процессов, не запускает программ и не меняет реестр: код окна
  # приходит по HTTP, и права выданы ровно под рисование и чтение.
  #
  # `db.get` здесь потому, что `sql` есть в белом списке модулей окна: без
  # этого права виджет с данными применился бы, попал в меню и упал при
  # первом открытии — то есть отказ пришёл бы позже всего, когда его труднее
  # всего связать с причиной.
  - name: app_window_scope
    kind: security.policy
    meta:
      comment: Права окна, собранного в рантайме.
    policy:
      actions:
        - process.context
        - db.get
        # Окно просит композитор открыть соседнее окно — тем же путём, что и
        # командный канал снаружи. Порождать процессы и запускать программы
        # оно по-прежнему не может: этих прав здесь нет.
        - process.send
        - process.registry
      resources: "*"
      effect: allow
