version: "1.0"
namespace: windows.tui_desktop.api

# Командный канал: тем же десктопом, за которым сидит человек, управляет
# агент снаружи. Обе стороны работают одновременно — композитор один, и он
# сам сериализует ввод с клавиатуры и команды из inbox.
#
# Рядом — мастерская: окно можно собрать прямо в работающем рантайме и
# сохранить, чтобы оно пережило перезапуск.

entries:
  # windows.tui_desktop.api:control
  - name: control
    kind: library.lua
    meta:
      comment: Найти композитор по имени, послать команду, дождаться ответа.
    source: file://control.lua
    modules:
      - channel
      - process
      - time
    imports:
      window_api: windows.tui_desktop.desktop:window_api

  # windows.tui_desktop.api:list_windows
  - name: list_windows
    kind: function.lua
    meta:
      comment: GET /tui-desktop/windows — открытые окна, фокус и размер экрана.
    source: file://list_windows.lua
    method: handler
    modules:
      - http
      - security
    imports:
      control: windows.tui_desktop.api:control
    security:
      policies: [windows.tui_desktop.security:desktop_command_channel]

  - name: list_windows.endpoint
    kind: http.endpoint
    meta:
      comment: Список окон за аутентифицированным роутером.
      router: app:api
    method: GET
    func: list_windows
    path: /tui-desktop/windows

  # windows.tui_desktop.api:open_window
  - name: open_window
    kind: function.lua
    meta:
      comment: POST /tui-desktop/windows — открыть окно с программой.
    source: file://open_window.lua
    method: handler
    modules:
      - http
      - json
      - security
    imports:
      control: windows.tui_desktop.api:control
    security:
      policies: [windows.tui_desktop.security:desktop_command_channel]

  - name: open_window.endpoint
    kind: http.endpoint
    meta:
      comment: Открытие окна за аутентифицированным роутером.
      router: app:api
    method: POST
    func: open_window
    path: /tui-desktop/windows

  # windows.tui_desktop.api:window_action
  - name: window_action
    kind: function.lua
    meta:
      comment: POST /tui-desktop/windows/{id}/{action} — действие над одним окном, включая чтение его экрана.
    source: file://window_action.lua
    method: handler
    modules:
      - http
      - json
      - security
    imports:
      control: windows.tui_desktop.api:control
    security:
      policies: [windows.tui_desktop.security:desktop_command_channel]

  - name: window_action.endpoint
    kind: http.endpoint
    meta:
      comment: Действие над окном за аутентифицированным роутером.
      router: app:api
    method: POST
    func: window_action
    path: /tui-desktop/windows/{id}/{action}

  # ─── Мастерская: окна, собранные в рантайме ──────────────────────────
  #
  # Реестр меняется на живую, поэтому окно не обязано быть файлом. Ручки
  # ниже принимают код будущего окна, поэтому живут за аутентифицированным
  # роутером и за собственной политикой.

  # windows.tui_desktop.api:create_app
  - name: create_app
    kind: function.lua
    meta:
      comment: POST /tui-desktop/apps — собрать окно в реестре и сохранить его исходник.
    source: file://create_app.lua
    method: handler
    modules:
      - http
      - json
      - security
      - sql
      - env
      - registry
    imports:
      repo: windows.tui_desktop.persist:repo
      apps: windows.tui_desktop.persist:apps
    security:
      policies:
        - windows.tui_desktop.security:workshop_scope
        # То же, что у композитора: хранилище читает имя базы из окружения.
        - windows.tui_desktop.security:storage_env

  - name: create_app.endpoint
    kind: http.endpoint
    meta:
      comment: Мастерская за аутентифицированным роутером.
      router: app:api
    method: POST
    func: create_app
    path: /tui-desktop/apps

  # windows.tui_desktop.api:list_apps
  - name: list_apps
    kind: function.lua
    meta:
      comment: GET /tui-desktop/apps — сохранённые окна и признак того, живы ли они в реестре.
    source: file://list_apps.lua
    method: handler
    modules:
      - http
      - security
      - sql
      - env
      - json
      - registry
    imports:
      repo: windows.tui_desktop.persist:repo
      apps: windows.tui_desktop.persist:apps
    security:
      policies:
        - windows.tui_desktop.security:workshop_scope
        # То же, что у композитора: хранилище читает имя базы из окружения.
        - windows.tui_desktop.security:storage_env

  - name: list_apps.endpoint
    kind: http.endpoint
    meta:
      comment: Список собранных окон за аутентифицированным роутером.
      router: app:api
    method: GET
    func: list_apps
    path: /tui-desktop/apps

  # windows.tui_desktop.api:delete_app
  - name: delete_app
    kind: function.lua
    meta:
      comment: DELETE /tui-desktop/apps/{name} — убрать окно из хранилища и реестра.
    source: file://delete_app.lua
    method: handler
    modules:
      - http
      - security
      - sql
      - env
      - json
      - registry
    imports:
      repo: windows.tui_desktop.persist:repo
      apps: windows.tui_desktop.persist:apps
    security:
      policies:
        - windows.tui_desktop.security:workshop_scope
        # То же, что у композитора: хранилище читает имя базы из окружения.
        - windows.tui_desktop.security:storage_env

  - name: delete_app.endpoint
    kind: http.endpoint
    meta:
      comment: Удаление собранного окна за аутентифицированным роутером.
      router: app:api
    method: DELETE
    func: delete_app
    path: /tui-desktop/apps/{name}
