version: "1.0"
namespace: windows.tui_desktop.api

# The command channel: the same desktop a person sits at is driven by an
# agent from outside. Both sides work at once — there is one compositor, and
# it serializes keyboard input and commands from the inbox itself.
#
# Next to it is the workshop: a window can be built right in the running
# runtime and saved so that it survives a restart.

entries:
  # windows.tui_desktop.api:control
  - name: control
    kind: library.lua
    meta:
      comment: Find the compositor by name, send a command, wait for the reply.
    source: file://control.lua
    modules:
      - channel
      - process
      - time
    imports:
      window_api: windows.tui_desktop.desktop:window_api

  # windows.tui_desktop.api:list_windows
  - name: list_windows
    kind: function.lua
    meta:
      comment: GET /tui-desktop/windows — open windows, focus and screen size.
    source: file://list_windows.lua
    method: handler
    modules:
      - http
      - security
    imports:
      control: windows.tui_desktop.api:control
    security:
      policies: [windows.tui_desktop.security:desktop_command_channel]

  - name: list_windows.endpoint
    kind: http.endpoint
    meta:
      comment: The window list behind the authenticated router.
      router: app:api
    method: GET
    func: list_windows
    path: /tui-desktop/windows

  # windows.tui_desktop.api:open_window
  - name: open_window
    kind: function.lua
    meta:
      comment: POST /tui-desktop/windows — open a window with a program.
    source: file://open_window.lua
    method: handler
    modules:
      - http
      - json
      - security
    imports:
      control: windows.tui_desktop.api:control
    security:
      policies: [windows.tui_desktop.security:desktop_command_channel]

  - name: open_window.endpoint
    kind: http.endpoint
    meta:
      comment: Opening a window behind the authenticated router.
      router: app:api
    method: POST
    func: open_window
    path: /tui-desktop/windows

  # windows.tui_desktop.api:window_action
  - name: window_action
    kind: function.lua
    meta:
      comment: POST /tui-desktop/windows/{id}/{action} — an action on one window, including reading its screen.
    source: file://window_action.lua
    method: handler
    modules:
      - http
      - json
      - security
    imports:
      control: windows.tui_desktop.api:control
    security:
      policies: [windows.tui_desktop.security:desktop_command_channel]

  - name: window_action.endpoint
    kind: http.endpoint
    meta:
      comment: An action on a window behind the authenticated router.
      router: app:api
    method: POST
    func: window_action
    path: /tui-desktop/windows/{id}/{action}

  # ─── Workshop: windows built in the runtime ──────────────────────────
  #
  # The registry changes live, so a window does not have to be a file. The
  # endpoints below accept the code of a future window, so they live behind
  # the authenticated router and behind their own policy.

  # windows.tui_desktop.api:create_app
  - name: create_app
    kind: function.lua
    meta:
      comment: POST /tui-desktop/apps — build a window in the registry and save its source.
    source: file://create_app.lua
    method: handler
    modules:
      - http
      - json
      - security
      - sql
      - env
      - registry
    imports:
      repo: windows.tui_desktop.persist:repo
      apps: windows.tui_desktop.persist:apps
    security:
      policies:
        - windows.tui_desktop.security:workshop_scope
        # Same as the compositor's: the storage reads the database name from the environment.
        - windows.tui_desktop.security:storage_env

  - name: create_app.endpoint
    kind: http.endpoint
    meta:
      comment: The workshop behind the authenticated router.
      router: app:api
    method: POST
    func: create_app
    path: /tui-desktop/apps

  # windows.tui_desktop.api:list_apps
  - name: list_apps
    kind: function.lua
    meta:
      comment: GET /tui-desktop/apps — saved windows and whether they are live in the registry.
    source: file://list_apps.lua
    method: handler
    modules:
      - http
      - security
      - sql
      - env
      - json
      - registry
    imports:
      repo: windows.tui_desktop.persist:repo
      apps: windows.tui_desktop.persist:apps
    security:
      policies:
        - windows.tui_desktop.security:workshop_scope
        # Same as the compositor's: the storage reads the database name from the environment.
        - windows.tui_desktop.security:storage_env

  - name: list_apps.endpoint
    kind: http.endpoint
    meta:
      comment: The list of built windows behind the authenticated router.
      router: app:api
    method: GET
    func: list_apps
    path: /tui-desktop/apps

  # windows.tui_desktop.api:delete_app
  - name: delete_app
    kind: function.lua
    meta:
      comment: DELETE /tui-desktop/apps/{name} — remove a window from the storage and the registry.
    source: file://delete_app.lua
    method: handler
    modules:
      - http
      - security
      - sql
      - env
      - json
      - registry
    imports:
      repo: windows.tui_desktop.persist:repo
      apps: windows.tui_desktop.persist:apps
    security:
      policies:
        - windows.tui_desktop.security:workshop_scope
        # Same as the compositor's: the storage reads the database name from the environment.
        - windows.tui_desktop.security:storage_env

  - name: delete_app.endpoint
    kind: http.endpoint
    meta:
      comment: Deleting a built window behind the authenticated router.
      router: app:api
    method: DELETE
    func: delete_app
    path: /tui-desktop/apps/{name}
