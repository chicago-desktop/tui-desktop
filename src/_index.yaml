version: "1.0"
namespace: chicago.tui_desktop

# A windowing desktop in the terminal.
#
# One compositor process owns the physical screen and draws the windows; each
# window is a separate process that writes to its own viewport and believes
# it owns the whole terminal. No window knows it is a window.
#
# The stack is the runtime's `tty` module (>= 0.3.40a): physical TTY → the
# compositor's surface → viewport → window process → PTY proxy for external
# programs.

entries:
  - name: definition
    kind: ns.definition
    meta:
      title: TUI Desktop
      description: Window manager for the terminal — a compositor with overlapping windows, windows with real programs under a PTY, a command channel for an agent and storage for windows built on the fly.

  # ─── Dependencies ────────────────────────────────────────────────────
  - version: "*"
    name: dep.wippy.migration
    kind: ns.dependency
    meta:
      comment: Migration for the table of windows built in the runtime.
    component: wippy/migration

  # ─── What the module asks of the application ─────────────────────────
  - name: target_db
    kind: ns.requirement
    meta:
      comment: The database where windows built in the runtime are stored.
    default: app:db
    targets:
      - entry: chicago.tui_desktop.migrations:01_create_windows
        path: .meta.target_db

  - name: api_router
    kind: ns.requirement
    meta:
      comment: The HTTP router the command channel and the workshop attach to. It must require authentication and endpoint_firewall.
    default: app:api
    targets:
      - entry: chicago.tui_desktop.api:list_windows.endpoint
        path: .meta.router
      - entry: chicago.tui_desktop.api:open_window.endpoint
        path: .meta.router
      - entry: chicago.tui_desktop.api:create_app.endpoint
        path: .meta.router
      - entry: chicago.tui_desktop.api:list_apps.endpoint
        path: .meta.router
      - entry: chicago.tui_desktop.api:delete_app.endpoint
        path: .meta.router
      - entry: chicago.tui_desktop.api:window_action.endpoint
        path: .meta.router

  # ─── Hosts ───────────────────────────────────────────────────────────
  # The only process on the real stdin/stdout/stderr is the compositor.
  #
  # hide_logs is mandatory: the surface's differ believes it is the only
  # writer to the terminal, and a log line scrambles the frame for good —
  # rows that did not change are not redrawn.
  #
  # ATTENTION, host application: the CLI's auto-detection of the terminal host
  # is just a count of `terminal.host` entries in the whole registry. Installing
  # this module makes it two, and from then on EVERY command requires an
  # explicit `--host`. This is a cost, not a defect; the alternative is to take
  # over someone else's host and deprive the application of its log.
  - name: terminal
    kind: terminal.host
    hide_logs: true
    lifecycle:
      auto_start: true

  # The window host. It implements FrameAttachmentHost — that is exactly what
  # makes it possible to pass a window a grant on the viewport at spawn.
  # max_processes limits how many windows can be open at once.
  - name: workers
    kind: process.host
    host:
      max_processes: 16
      workers: 4
    lifecycle:
      auto_start: true

  # Launching external programs for PTY windows. Without command_whitelist: the
  # check there is an exact match of the whole string including arguments, so
  # "/bin/bash" does not allow "/bin/bash -i". The restriction
  # is held by the policy.
  - name: exec
    kind: exec.native
    default_env:
      TERM: xterm-256color
