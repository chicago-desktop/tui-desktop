version: "1.0"
namespace: windows.tui_desktop

# Оконный десктоп в терминале.
#
# Один процесс-композитор владеет физическим экраном и рисует окна; каждое
# окно — отдельный процесс, который пишет в собственный viewport и считает,
# что владеет терминалом целиком. Ни одно окно не знает, что оно окно.
#
# Стек — модуль `tty` рантайма (>= 0.3.40a): physical TTY → surface
# композитора → viewport → процесс окна → PTY-прокси для внешних программ.

entries:
  - name: definition
    kind: ns.definition
    meta:
      title: TUI Desktop
      description: Оконный менеджер для терминала — композитор с перекрывающимися окнами, окна с настоящими программами под PTY, командный канал для агента и хранилище окон, собранных на ходу.

  # ─── Зависимости ─────────────────────────────────────────────────────
  - version: "*"
    name: dep.wippy.migration
    kind: ns.dependency
    meta:
      comment: Миграция для таблицы окон, собранных в рантайме.
    component: wippy/migration

  # ─── Что модуль просит у приложения ──────────────────────────────────
  - name: target_db
    kind: ns.requirement
    meta:
      comment: База, где хранятся окна, собранные в рантайме.
    default: app:db
    targets:
      - entry: windows.tui_desktop.migrations:01_create_windows
        path: .meta.target_db

  - name: api_router
    kind: ns.requirement
    meta:
      comment: HTTP-роутер, к которому крепятся командный канал и мастерская. Обязан требовать аутентификацию и endpoint_firewall.
    default: app:api
    targets:
      - entry: windows.tui_desktop.api:list_windows.endpoint
        path: .meta.router
      - entry: windows.tui_desktop.api:open_window.endpoint
        path: .meta.router
      - entry: windows.tui_desktop.api:create_app.endpoint
        path: .meta.router
      - entry: windows.tui_desktop.api:list_apps.endpoint
        path: .meta.router
      - entry: windows.tui_desktop.api:delete_app.endpoint
        path: .meta.router
      - entry: windows.tui_desktop.api:window_action.endpoint
        path: .meta.router

  # ─── Хосты ───────────────────────────────────────────────────────────
  # Единственный процесс на настоящих stdin/stdout/stderr — композитор.
  #
  # hide_logs обязателен: диффер поверхности считает себя единственным
  # писателем в терминал, и строка лога разъезжает кадр насовсем —
  # неизменившиеся строки не перерисовываются.
  #
  # ВНИМАНИЕ приложению-хозяину: автодетект терминального хоста в CLI —
  # просто подсчёт записей `terminal.host` во всём реестре. Установка этого
  # модуля делает их две, и с этого момента КАЖДАЯ команда требует явного
  # `--host`. Это цена, а не дефект; альтернатива — забрать чужой хост и
  # лишить приложение лога.
  - name: terminal
    kind: terminal.host
    hide_logs: true
    lifecycle:
      auto_start: true

  # Хост окон. Он реализует FrameAttachmentHost — именно это позволяет
  # передать окну грант на viewport при spawn. max_processes ограничивает,
  # сколько окон может быть открыто разом.
  - name: workers
    kind: process.host
    host:
      max_processes: 16
      workers: 4
    lifecycle:
      auto_start: true

  # Запуск внешних программ для PTY-окон. Без command_whitelist: проверка
  # там — точное совпадение всей строки вместе с аргументами, так что
  # "/bin/bash" не разрешает "/bin/bash -i". Ограничение
  # держит политика.
  - name: exec
    kind: exec.native
    default_env:
      TERM: xterm-256color
